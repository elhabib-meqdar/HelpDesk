<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">

</head>

<body>
    <header>
        <div id="EnTete">
            <div id="logo">
                <div class="hLogo">
                    <p id="h">H</p>
                </div>
                <p class="helpDesk">HelpDesk</p>
            </div>
            <p id="men">☰</p>
            <p id="entrepriseName">Atlas Solutions / Support</p>
            

        </div>
    </header>
    <main>
        <section class="introduction">

            <h1>Gestion des demandes</h1>
            <p class="text">Suivez et gérez les incidents informatiques.</p>
            <div class="demande">

                <div class="part">
                    <h2>Créer une demande</h2>
                    <p class="text">Décrivez votre problème informatique.</p>
                </div>

                <div class="champs">
                    <form>
                        <div class="form laire">
                            <div class="formtitre">
                                <label for="titre">Titre du problème *</label><br>
                                <input type="text" id="titre">
                            </div>
                            <div class=" form catégorie">
                                <label for="catégorie">Catégorie *</label><br>
                                <select id="catégorie">
                                    <option value="Réseau">Réseau</option>
                                    <option value="Logiciel">Logiciel</option>
                                    <option value="Matériel">Matériel</option>
                                </select>
                            </div>
                            <div class="form priorité">
                                <label for="priorité">Priorité *</label><br>
                                <select name="priorité" id="priorité">
                                    <option value="Haute">Haute</option>
                                    <option value="Normale">Normale</option>
                                    <option value="Basse">Basse</option>
                                </select>
                            </div>
                            <div class=" form description">
                                <label for="descrip">Description *</label><br>
                                <input type="" id="descrip" placeholder=" Décrivez votre problème...">
                            </div>
                        </div>
                        <div class="">

                        </div>
                    </form>
                </div>
            </div>
            <div class="buttonn">
                <button id="bottonAjouter" >＋ Ajouter la demande</button>
            </div>

        </section>
        <section class="liste">
            <div class="enTete">
                <div class="part">
                    <h2>Liste des demandes</h2>
                    <div id="Ndemande">
                        
                </div>
                <div id="cartesOuTableau">
                    <button id="Cartes">▦  Cartes</button>
                    <button id="Tableau">☷  Tableau</button>
                </div>

                

            </div>

            <div id="ticketsContainer" >
            </div>
        </section>
    </main>
    <footer>

    </footer>

</body>
<script src="js/script.js"></script>
</html>
